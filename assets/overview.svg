<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="16" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="92" rx="16" fill="url(#hdr)"/>
  <rect x="0" y="60" width="1000" height="32" fill="url(#hdr)"/>
  <text x="40" y="50" font-size="30" font-weight="700" fill="#ffffff">Watermarking for Images, Video &amp; Audio</text>
  <text x="40" y="76" font-size="15" fill="#cbd5e1">Post-hoc and in-generation methods · removal &amp; forgery attacks · benchmarks</text>

  <!-- Pipeline -->
  <text x="40" y="130" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">THE PIPELINE</text>

  <g font-size="14">
    <rect x="40" y="145" width="140" height="74" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="110" y="176" text-anchor="middle" font-weight="600" fill="#0f172a">Content</text>
    <text x="110" y="198" text-anchor="middle" font-size="12" fill="#475569">image · video · audio</text>

    <rect x="220" y="145" width="190" height="74" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="315" y="170" text-anchor="middle" font-weight="600" fill="#0c4a6e">Embed message m</text>
    <text x="315" y="190" text-anchor="middle" font-size="12" fill="#075985">post-hoc encoder, or</text>
    <text x="315" y="206" text-anchor="middle" font-size="12" fill="#075985">inside the generator</text>

    <rect x="450" y="145" width="190" height="74" rx="10" fill="#fee2e2" stroke="#f87171"/>
    <text x="545" y="170" text-anchor="middle" font-weight="600" fill="#7f1d1d">Distortions &amp; attacks</text>
    <text x="545" y="190" text-anchor="middle" font-size="12" fill="#991b1b">compression, edits, crops,</text>
    <text x="545" y="206" text-anchor="middle" font-size="12" fill="#991b1b">regeneration, forgery</text>

    <rect x="680" y="145" width="140" height="74" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="750" y="170" text-anchor="middle" font-weight="600" fill="#0c4a6e">Extract message</text>
    <text x="750" y="190" text-anchor="middle" font-size="12" fill="#075985">decoder, or</text>
    <text x="750" y="206" text-anchor="middle" font-size="12" fill="#075985">noise inversion</text>

    <rect x="860" y="145" width="100" height="74" rx="10" fill="#dcfce7" stroke="#4ade80"/>
    <text x="910" y="170" text-anchor="middle" font-weight="600" fill="#14532d">Verify</text>
    <text x="910" y="190" text-anchor="middle" font-size="12" fill="#166534">detect or</text>
    <text x="910" y="206" text-anchor="middle" font-size="12" fill="#166534">attribute</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="182" y1="182" x2="216" y2="182"/>
    <line x1="412" y1="182" x2="446" y2="182"/>
    <line x1="642" y1="182" x2="676" y2="182"/>
    <line x1="822" y1="182" x2="856" y2="182"/>
  </g>

  <!-- Taxonomy -->
  <text x="40" y="262" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">WHAT THIS LIST COVERS</text>

  <g font-size="13">
    <!-- Image -->
    <rect x="40" y="277" width="290" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="40" y="277" width="290" height="6" rx="3" fill="#6366f1"/>
    <text x="60" y="310" font-size="17" font-weight="700" fill="#0f172a">Image</text>
    <text x="60" y="336" font-weight="600" fill="#334155">Post-hoc</text>
    <text x="60" y="354" fill="#64748b">HiDDeN · StegaStamp · WAM · VINE</text>
    <text x="60" y="382" font-weight="600" fill="#334155">In-generation</text>
    <text x="60" y="400" fill="#64748b">Stable Signature · Tree-Ring</text>
    <text x="60" y="418" fill="#64748b">Gaussian Shading · PRC · SEAL</text>

    <!-- Video -->
    <rect x="355" y="277" width="290" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="355" y="277" width="290" height="6" rx="3" fill="#0ea5e9"/>
    <text x="375" y="310" font-size="17" font-weight="700" fill="#0f172a">Video</text>
    <text x="375" y="336" font-weight="600" fill="#334155">Post-hoc</text>
    <text x="375" y="354" fill="#64748b">RivaGAN · Video Seal · WaTeRFlow</text>
    <text x="375" y="382" font-weight="600" fill="#334155">In-generation (video diffusion)</text>
    <text x="375" y="400" fill="#64748b">VideoShield · Safe-Sora</text>
    <text x="375" y="418" fill="#64748b">SIGMark · SPDMark</text>

    <!-- Audio -->
    <rect x="670" y="277" width="290" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="670" y="277" width="290" height="6" rx="3" fill="#f59e0b"/>
    <text x="690" y="310" font-size="17" font-weight="700" fill="#0f172a">Audio</text>
    <text x="690" y="336" font-weight="600" fill="#334155">Neural audio watermarking</text>
    <text x="690" y="354" fill="#64748b">AudioSeal · WavMark · Timbre</text>
    <text x="690" y="382" font-weight="600" fill="#334155">Generative audio</text>
    <text x="690" y="400" fill="#64748b">XAttnMark · Latent WM</text>
    <text x="690" y="418" fill="#64748b">SilentCipher</text>
  </g>

  <!-- Cross-cutting -->
  <g font-size="13">
    <rect x="40" y="455" width="452" height="44" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="60" y="482" font-weight="700" fill="#7f1d1d">Attacks</text>
    <text x="124" y="482" font-size="12" fill="#991b1b">regeneration · UnMarker · forgery · averaging</text>
    <rect x="508" y="455" width="452" height="44" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="528" y="482" font-weight="700" fill="#14532d">Benchmarks</text>
    <text x="618" y="482" font-size="12" fill="#166534">WAVES · W-Bench · VideoMarkBench · AudioMarkBench</text>
  </g>
</svg>
